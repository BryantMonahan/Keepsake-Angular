<div class="grid w-[min(26rem,100%)] gap-10 rounded-card bg-surface p-10 font-body font-medium text-ink shadow-lift"
  role="alertdialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
  <div class="flex items-start gap-3">
    <span class="inline-flex pt-1 text-error"><app-icon name="alert" [size]="20" /></span>
    <div>
      <h2 id="confirm-title" class="text-xl">Confirm action</h2>
      <p id="confirm-message" class="mt-2 font-normal text-ink-2">{{ data.message }}</p>
    </div>
  </div>

  <div class="flex justify-end gap-2">
    <button type="button" class="btn" (click)="cancel()">Cancel</button>
    <button type="button" class="btn btn--primary border-error! bg-error! hover:border-ink! hover:bg-ink!"
      (click)="confirm()">Confirm</button>
  </div>
</div>
