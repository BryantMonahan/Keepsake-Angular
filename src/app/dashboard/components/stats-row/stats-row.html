<dl class="grid grid-cols-2 gap-3 lg:gap-4 xl:grid-cols-4">
  @for (stat of stats(); track stat.label) {
  <!-- @container: the figure scales with the card's own width, so it never spills out of a narrow card -->
  <div class="@container flex min-w-0 flex-col gap-1 rounded-card bg-surface p-4 text-muted shadow-card sm:p-6">
    <dt class="text-sm font-medium">{{ stat.label }}</dt>
    <dd class="num -order-1 text-[clamp(1.125rem,17cqi,1.875rem)] leading-none whitespace-nowrap text-ink">{{ stat.value }}</dd>
    @if (stat.note) {
    <dd class="text-sm">{{ stat.note }}</dd>
    }
  </div>
  }
</dl>
