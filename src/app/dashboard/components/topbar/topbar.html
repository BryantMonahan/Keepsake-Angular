<header class="flex min-h-(--bar) items-center gap-3 border-b border-rule bg-paper px-(--gutter)">
  <label for="dashboard-drawer" aria-label="Open menu"
    class="btn btn--quiet btn--icon drawer-focus:outline-2 drawer-focus:outline-offset-2 drawer-focus:outline-focus lg:hidden">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </label>

  <div class="min-w-0 flex-1">
    <label class="relative block w-full max-w-[420px]">
      <span class="sr-only">Search entries</span>
      <svg class="pointer-events-none absolute top-1/2 left-3 -translate-y-1/2 text-muted" xmlns="http://www.w3.org/2000/svg"
        width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        aria-hidden="true">
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.3-4.3" />
      </svg>
      <input type="search" class="input pl-10 text-md sm:text-sm" placeholder="Search entries, transcripts…" />
    </label>
  </div>

  <div class="flex items-center gap-1">
    <button type="button" class="btn btn--quiet btn--icon" aria-label="Notifications">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
        <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
      </svg>
    </button>

    <details class="menu">
      <summary class="btn btn--quiet btn--icon rounded-pill" aria-label="Account menu">
        <span class="inline-grid size-8 place-items-center rounded-pill bg-accent-soft text-xs font-medium text-ink" aria-hidden="true">BM</span>
      </summary>
      <ul class="menu__list">
        <li><a class="menu__item">Profile</a></li>
        <li><a class="menu__item">Account settings</a></li>
        <li><a class="menu__item">Sign out</a></li>
      </ul>
    </details>
  </div>
</header>
