<aside class="flex h-full flex-col overflow-y-auto border-r border-rule bg-paper-2">
  <nav class="flex-1 p-3" aria-label="Main">
    <ul class="flex flex-col gap-0.5">
      @for (link of links; track link.label) {
      <li>
        @if (link.path) {
        <a [class]="linkClass" [routerLink]="[link.path]" routerLinkActive="is-active" ariaCurrentWhenActive="page">
          <app-icon [name]="link.icon" class="in-[.is-active]:text-accent" />
          {{ link.label }}
        </a>
        } @else {
        <a [class]="linkClass" aria-disabled="true">
          <app-icon [name]="link.icon" />
          {{ link.label }}
        </a>
        }
      </li>
      }
    </ul>
  </nav>

  <div class="flex items-center gap-3 border-t border-rule px-6 py-4">
    <span class="inline-grid size-9 shrink-0 place-items-center rounded-pill bg-accent-soft text-sm font-medium text-ink" aria-hidden="true">BM</span>
    <p class="min-w-0 truncate text-sm font-medium text-ink">Bryan Monahan</p>
  </div>
</aside>
