<section class="card" aria-labelledby="week-title">
  <h2 id="week-title">Past 7 days</h2>
  <ol class="mt-6 grid grid-cols-7 gap-2">
    @for (day of days(); track $index) {
    <li class="grid justify-items-center gap-2">
      <!-- a recorded day fills with its own colour; an empty one stays an outline -->
      <span class="aspect-square w-full max-w-9 rounded-input"
        [class]="'tint-' + day.dow + (day.active ? ' plastic' : ' border-[1.5px] border-dashed border-rule-2')" aria-hidden="true"></span>
      <span class="text-sm" [class]="$last ? 'font-medium text-ink' : 'text-muted'">{{ day.day }}</span>
      <span class="sr-only">{{ day.active ? 'recorded' : 'nothing recorded' }}</span>
    </li>
    }
  </ol>
  <p class="mt-4 text-sm text-muted">{{ numOfEntriesText() }} logged in the past 7 days</p>
</section>
