<app-shell>
  <header>
    <time class="mb-2 block text-sm font-medium text-muted" [attr.datetime]="todayIso">{{ today | date: 'EEEE, MMMM d, y' }}</time>
    <h1>Good {{ timeOfDay() }}, {{ username }}</h1>
    <p class="mt-2 max-w-[52ch] text-lg leading-snug text-ink-2">Capture today’s thoughts before you forget them.</p>
  </header>

  <app-stats-row />

  <div id="record" class="grid scroll-mt-[calc(var(--bar)+24px)] grid-cols-1 gap-16 xl:grid-cols-[minmax(0,2fr)_minmax(0,1fr)] xl:gap-(--gap-columns)">
    <app-voice-recorder class="block min-w-0" />

    <div class="flex min-w-0 flex-col gap-16 xl:gap-(--gap-columns)">
      <app-weekly-streak class="block" />
      <app-on-this-day class="block" />
    </div>
  </div>

  <app-recent-entries class="block" />
</app-shell>
