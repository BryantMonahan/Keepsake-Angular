<div class="drawer lg:drawer-open bg-base-200 min-h-screen">
    <input id="dashboard-drawer" type="checkbox" class="drawer-toggle" />

    <div class="drawer-content flex flex-col">
        <app-topbar></app-topbar>

        <!-- Main content -->
        <main class="flex-1 p-4 lg:p-8 space-y-6 max-w-7xl w-full mx-auto">
            <!-- Greeting -->
            <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4">
                <div>
                    <h1 class="text-2xl lg:text-3xl font-bold tracking-tight">Good {{ timeOfDay() }}, {{ username }}
                    </h1>
                    <p class="text-base-content/60 mt-1">Capture today's thoughts before you forget them.</p>
                </div>
            </div>

            <app-stats-row></app-stats-row>

            <!-- Record + side panel -->
            <div id="record" class="grid grid-cols-1 lg:grid-cols-3 gap-6 scroll-mt-20">
                <div class="lg:col-span-2">
                    <app-voice-recorder></app-voice-recorder>
                </div>

                <div class="flex flex-col gap-6">
                    <app-transcription-usage></app-transcription-usage>
                    <app-weekly-streak></app-weekly-streak>
                </div>
            </div>

            <app-recent-entries></app-recent-entries>
        </main>
    </div>

    <!-- Sidebar -->
    <div class="drawer-side z-40">
        <label for="dashboard-drawer" aria-label="Close menu" class="drawer-overlay"></label>
        <app-sidebar></app-sidebar>
    </div>
</div>
